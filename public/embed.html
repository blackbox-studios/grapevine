<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Video</title>
<!--
  The YouTube player, wrapped in a page served from this app's own domain.

  It exists for one platform. The packaged iOS app serves itself from `capacitor://localhost`,
  YouTube validates the origin embedding its player, and it refuses anything that is not
  http(s) with error 153 — and no Capacitor setting can change that, because WebKit reserves
  http and https, so `iosScheme` rejects both and silently keeps the default. The app cannot be
  the embedder, so something served over http(s) has to be, and this is the smallest thing that
  can: <Video/> points its iframe here, this points an iframe at YouTube, and YouTube sees an
  ordinary web origin. The scheme is the whole of what it wanted — a LAN dev server over
  cleartext http satisfies it as well as the deployed site does.

  Plain HTML in public/ rather than a route under src/app, deliberately. It inherits no layout,
  no providers and no auth gate, it is copied verbatim into both build targets, and it carries
  no bundle — an intermediate frame should cost a few hundred bytes, not the app.

  It builds exactly one URL and refuses to build any other: the id is checked against the same
  eleven-character shape `youtubeId` enforces before it is put in an `src`, so a query string
  cannot aim this at anything. Same rule as the server's, restated because this file shares no
  code with it.

  `allow` is repeated here on purpose. Permissions delegate down one frame at a time, so
  autoplay granted to this page by the app is granted to the player only if this page passes
  it on — without the attribute below, the tap that already said "play" would land on a
  stopped player.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  iframe { display: block; border: 0; width: 100%; height: 100%; }
  p { color: #8b98a5; font: 14px/1.4 system-ui, sans-serif; padding: 16px; margin: 0; }
</style>
<script>
  var id = new URLSearchParams(location.search).get("v") || ""
  if (/^[\w-]{11}$/.test(id)) {
    var frame = document.createElement("iframe")
    frame.src = "https://www.youtube.com/embed/" + id + "?autoplay=1&playsinline=1&rel=0"
    frame.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
    frame.allowFullscreen = true
    frame.title = "YouTube video player"
    addEventListener("DOMContentLoaded", function () { document.body.appendChild(frame) })
  } else {
    addEventListener("DOMContentLoaded", function () {
      document.body.innerHTML = "<p>This video could not be loaded.</p>"
    })
  }
</script>
