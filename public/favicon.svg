<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 174 174" width="174" height="174" fill="none">
  <!-- Grapevine's mark. A favicon renders in its own document and inherits nothing, so
       `currentColor` would resolve to black and CSS custom properties are out of reach.
       The two brand greens are therefore written here as literals and kept in step with
       the brand tokens in src/globals.css by hand: jungle green in light, lime in dark.

       Do not write a CSS custom property name in this comment. Two consecutive hyphens
       are illegal inside an XML comment, so naming one voids the whole document and the
       icon silently stops rendering.

       The canvas is square and larger than the 139x100 mark on purpose: a tab favicon is
       scaled into a square slot, so a tight non-square viewBox letterboxes and the mark
       lands smaller than the space allows. The group below centres it at 80% width. -->
  <style>
    .m { fill: #2BBB9C }
    @media (prefers-color-scheme: dark) {
      .m { fill: #ffffff }
    }
  </style>
  <g transform="translate(17.5 37)">
    <path class="m" d="M139 63.5921V32.2924C139 14.4765 124.734 0.0722022 106.969 0H74.9558V32.0758C74.9558 32.0758 74.9558 32.2202 74.9558 32.2924C74.9558 49.8195 89.2219 64.1516 106.752 64.1516H128.161C128.107 77.9061 116.852 89.1155 103.109 89.1155V100C122.984 100 139 83.9169 139 64.0613C139 63.8988 139 63.7545 139 63.5921Z"/>
    <path class="m" d="M64.0082 63.5921V32.2924C64.0082 14.4765 49.7962 0.0722022 32.0131 0H0V32.0758H0.0180356C0.0180356 32.0758 0 32.2202 0 32.2924C0 49.8195 14.2842 64.1516 31.8147 64.1516H53.2049C53.0967 77.9061 41.9327 89.1155 28.1715 89.1155V100C48.0106 100 64.0082 83.9635 64.0082 64.1079C64.0082 63.9454 64.0082 63.7545 64.0082 63.5921Z"/>
  </g>
</svg>
